<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen justify-center items-center flex">
    <div class="bg-white p-8 rounded-xl shadow-1g w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">My Daily Routine Tracker</h1>
        <div class="bg-blue-50 p-4 rounded-1g mb-4">
            <p>Total Tasks: <span id="totalTasks">0</span></p>
            <p>Completed: <span id="completedTasks">0</span></p>
            <p>Remaining: <span id="remainingTasks">0</span></p>

        </div>
        <p id="successMessage" class="text-center text-green-600 font-bold mt-4 hidden">🎉 Alhamdulilah! You have completed all your tasks for today. 🤲</p>
    <input id="taskInput" type="text" placeholder="Enter a task" class="border border-gray-300 p-3 w-full rounded-1g mb-4">
    <button id="addBtn" class="bg-blue-600 text-white w-full p-3 rounded-1g">Add task</button>
    <ul id="taskList" class="mt-6"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
